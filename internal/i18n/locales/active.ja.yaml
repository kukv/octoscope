footer:
  list:
    other: "j/k:移動  enter:詳細  tab:PR/Issue  r:更新  o:Web  d:diff  q:終了"
  close:
    other: "x:クローズ"
  reopen:
    other: "x:再オープン"
  picker:
    other: "space:選択  enter:適用  esc:中止"
  compose:
    other: "ctrl+s:送信  esc:中止"
  error:
    other: "q:終了"
  work:
    other: "h/l:列  j/k:移動  enter:詳細  r:再取得  d:diff  q:終了"
  # detail のキーバーはこの並びから組み立てる。重要なものから先に並べ、
  # 端末幅が足りないときは末尾から落とす（internal/tui/detail/render.go の
  # fitKeyBar。diff の下の同じ仕組み）。esc は先頭に置く — 落としてはいけない
  # 唯一の出口だから。state は close か reopen のどちらか該当する方で、
  # どちらも該当しない（マージ済み）ときは丸ごと外れる。
  detail:
    esc:
      other: "esc:戻る"
    move:
      other: "j/k:移動"
    comment:
      other: "c:コメント"
    review:
      other: "v:レビュー"
    diff:
      other: "d:diff"
    refresh:
      other: "r:更新"
    web:
      other: "o:Web"
    labels:
      other: "l:ラベル"
    assign:
      other: "a:担当"
  submit:
    other: "tab:種別  ctrl+s:提出  esc:取消"
  discard:
    other: "y:破棄  n:やめる"
  # diff のキーバーはこの並びから組み立てる。重要なものから先に並べ、
  # 端末幅が足りないときは末尾から落とす（internal/tui/diff/render.go の
  # fitKeyBar）。esc は先頭に置く — 落としてはいけない唯一の出口だから。
  diff:
    esc:
      other: "esc:戻る"
    comment:
      other: "c:コメント"
    review:
      other: "v:レビュー"
    discard:
      other: "X:破棄"
    line:
      other: "j/k:行"
    file:
      other: "[/]:ファイル"
    hunk:
      other: "{/}:ハンク"
    open:
      other: "enter:開く"
    pane:
      other: "h/l:ペイン"
    refresh:
      other: "r:再取得"
  diff_comment:
    other: "ctrl+s:送信  esc:取消"

