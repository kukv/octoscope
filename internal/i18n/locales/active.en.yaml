footer:
  list:
    other: "j/k:move  enter:detail  tab:PR/Issue  r:refresh  o:web  d:diff  s:checks  q:quit"
  close:
    other: "x:close"
  reopen:
    other: "x:reopen"
  picker:
    other: "space:toggle  enter:apply  esc:cancel"
  compose:
    other: "ctrl+s:send  esc:cancel"
  error:
    esc:
      other: "esc:back"
    quit:
      other: "q:quit"
  work:
    other: "h/l:column  j/k:move  enter:detail  r:refresh  d:diff  s:checks  q:quit"
  # detail's key bar is built from these, most important first, and dropped
  # from the end when the terminal is too narrow for all of them (see
  # internal/tui/layout.FitKeyBar, the same mechanism as diff's below). esc
  # is first because it must never be the one dropped: it is the only way
  # out of the view. state is close or reopen, whichever applies, and is
  # left out entirely once the item can do neither (merged).
  detail:
    esc:
      other: "esc:back"
    move:
      other: "j/k:move"
    comment:
      other: "c:comment"
    review:
      other: "v:review"
    diff:
      other: "d:diff"
    checks:
      other: "s:checks"
    merge:
      other: "m:merge"
    refresh:
      other: "r:refresh"
    web:
      other: "o:web"
    labels:
      other: "l:labels"
    assign:
      other: "a:assign"
  submit:
    other: "tab:event  ctrl+s:submit  esc:cancel"
  discard:
    other: "y:discard  n:keep"
  # diff's key bar is built from these, most important first, and dropped
  # from the end when the terminal is too narrow for all of them (see
  # internal/tui/layout.FitKeyBar). esc is first because it must never be
  # the one dropped: it is the only way out of the view.
  diff:
    esc:
      other: "esc:back"
    comment:
      other: "c:comment"
    review:
      other: "v:review"
    discard:
      other: "X:discard"
    line:
      other: "j/k:line"
    file:
      other: "[/]:file"
    hunk:
      other: "{/}:hunk"
    open:
      other: "enter:open"
    pane:
      other: "h/l:pane"
    refresh:
      other: "r:refresh"
  diff_comment:
    other: "ctrl+s:send  esc:cancel"
  # checks' key bar is built from these, most important first, and dropped
  # from the end when the terminal is too narrow for all of them (see
  # internal/tui/layout.FitKeyBar, the same mechanism as diff's above). esc
  # is first because it must never be the one dropped: it is the only way
  # out of the view.
  checks:
    esc:
      other: "esc:back"
    move:
      other: "j/k:move"
    log:
      other: "enter:log"
    full:
      other: "L:full log"
    rerun:
      other: "R:rerun"
    pane:
      other: "h/l:pane"
    open:
      other: "o:web"
    refresh:
      other: "r:refresh"

