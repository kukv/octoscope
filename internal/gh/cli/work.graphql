# One column of the Work board. The search string is the caller's: the four
# columns differ only in that, and sending them together is what made GitHub
# stop answering.
#
# reviewDecision and isDraft are GraphQL-only: REST does not expose them
# (spec 3.3).
#
# search is not paged: GitHub's search connection returns at most 1000
# results however it is paged, well past what a 50-card column shows anyway.
query ($search: String!) {
  results: search(type: ISSUE, first: 50, query: $search) {
    nodes { ...WorkItem }
  }
}

fragment WorkItem on SearchResultItem {
  __typename
  ... on PullRequest {
    number
    title
    state
    url
    isDraft
    updatedAt
    bodyText
    reviewDecision
    headRefName
    baseRefName
    additions
    deletions
    author {
      login
    }
    # 100 is GitHub's cap for a connection, and an item can carry any number
    # of labels.
    labels(first: 100) {
      nodes { ...LabelFields }
    }
    repository {
      nameWithOwner
    }
    commits(last: 1) {
      nodes {
        commit {
          statusCheckRollup {
            contexts(first: 100) {
              nodes { ...CheckContext }
            }
          }
        }
      }
    }
  }
  ... on Issue {
    number
    title
    state
    url
    updatedAt
    bodyText
    author {
      login
    }
    # 100 is GitHub's cap for a connection, and an item can carry any number
    # of labels.
    labels(first: 100) {
      nodes { ...LabelFields }
    }
    repository {
      nameWithOwner
    }
  }
}

# color is the six hex digits GitHub stores for the label, with no leading
# "#": the badge reproduces it as a background.
fragment LabelFields on Label {
  name
  color
}

# CheckRun reports status and conclusion and calls its name "name"; the older
# StatusContext reports a single state and calls its name "context". Both
# shapes have to be asked for.
fragment CheckContext on StatusCheckRollupContext {
  __typename
  ... on CheckRun {
    name
    status
    conclusion
  }
  ... on StatusContext {
    context
    state
  }
}
