# The Work board in one request: four aliased searches over one shared
# selection. The aliases are the keys ListWork reads back, so they have to
# match the ones listed in workSearches.
#
# reviewDecision and isDraft are GraphQL-only: REST does not expose them
# (spec 3.3).
#
# search asks for 50 per column and is not paged. The Work board is what to
# look at now, not a full listing: GitHub's search returns at most 1000
# results however it is paged, and a column past 50 cards is already past
# what the board can be read as.
query {
  reviewRequested: search(type: ISSUE, first: 50, query: "is:open is:pr review-requested:@me") {
    nodes { ...WorkItem }
  }
  yourPRs: search(type: ISSUE, first: 50, query: "is:open is:pr author:@me") {
    nodes { ...WorkItem }
  }
  assigned: search(type: ISSUE, first: 50, query: "is:open assignee:@me") {
    nodes { ...WorkItem }
  }
  mentioned: search(type: ISSUE, first: 50, query: "is:open mentions:@me") {
    nodes { ...WorkItem }
  }
}

fragment WorkItem on SearchResultItem {
  __typename
  ... on PullRequest {
    number
    title
    url
    isDraft
    updatedAt
    bodyText
    reviewDecision
    headRefName
    baseRefName
    additions
    deletions
    author {
      login
    }
    labels(first: 100) {
      nodes { ...LabelFields }
    }
    repository {
      nameWithOwner
    }
    commits(last: 1) {
      nodes {
        commit {
          statusCheckRollup {
            contexts(first: 100) {
              nodes { ...CheckContext }
            }
          }
        }
      }
    }
  }
  ... on Issue {
    number
    title
    url
    updatedAt
    bodyText
    author {
      login
    }
    labels(first: 100) {
      nodes { ...LabelFields }
    }
    repository {
      nameWithOwner
    }
  }
}

# labels asks for 100, GitHub's cap for a connection. There is no documented
# limit on how many labels one item may carry, and a card that silently drops
# labels past the tenth is the same failure as the Repos tab stopping at 30.
#
# color is the six hex digits GitHub stores for the label, with no leading
# "#": the badge reproduces it as a background.
fragment LabelFields on Label {
  name
  color
}

# CheckRun reports status and conclusion and calls its name "name"; the older
# StatusContext reports a single state and calls its name "context". Both
# shapes have to be asked for.
fragment CheckContext on StatusCheckRollupContext {
  __typename
  ... on CheckRun {
    name
    status
    conclusion
  }
  ... on StatusContext {
    context
    state
  }
}
