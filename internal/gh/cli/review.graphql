query ($owner: String!, $name: String!, $number: Int!, $after: String) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      id
      title
      headRefName
      baseRefName
      additions
      deletions
      # Only the id is taken from the unsubmitted review. Its comments are
      # not selectable with a side: PullRequestReviewComment has neither
      # diffSide nor side. They arrive through reviewThreads instead, which
      # does carry diffSide and does list a pending thread (measured against
      # kukv/octoscope#55 on 2026-09-07).
      # first: 1 is not a truncation: GitHub allows one unsubmitted review per
      # user per pull request, so there is never a second one to miss.
      reviews(states: [PENDING], first: 1) {
        nodes {
          id
        }
      }
      # first is capped at 100 by GitHub (101 is refused with
      # EXCESSIVE_PAGINATION), so a pull request with more threads than that
      # needs pageInfo and a second request. See PRReviewContext.
      reviewThreads(first: 100, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          isResolved
          isOutdated
          path
          line
          originalLine
          diffSide
          # Not paged: this is a nested connection, so following it would
          # need one more request per thread. A review thread with more than
          # 50 comments does not happen in practice.
          comments(first: 50) {
            nodes {
              body
              createdAt
              author {
                login
              }
              pullRequestReview {
                state
              }
            }
          }
        }
      }
    }
  }
}
