query ($owner: String!, $name: String!, $number: Int!, $after: String) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      id
      title
      headRefName
      baseRefName
      additions
      deletions
      # Only the id is taken from the unsubmitted review. Its comments are
      # not selectable with a side: PullRequestReviewComment has neither
      # diffSide nor side. They arrive through reviewThreads instead, which
      # does carry diffSide and does list a pending thread (measured against
      # kukv/octoscope#55 on 2026-09-07).
      # GitHub allows one unsubmitted review per user per pull request, so
      # first: 1 is not a truncation.
      reviews(states: [PENDING], first: 1) {
        nodes {
          id
        }
      }
      # first is capped at 100 by GitHub (101 is refused with
      # EXCESSIVE_PAGINATION), so pageInfo/after page beyond it.
      reviewThreads(first: 100, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          originalLine
          diffSide
          # A nested connection: following it costs one more request per
          # thread, so only a thread that says hasNextPage gets one
          # (thread_comments.graphql).
          comments(first: 50) {
            pageInfo {
              hasNextPage
              endCursor
            }
            nodes {
              body
              createdAt
              author {
                login
              }
              pullRequestReview {
                state
              }
            }
          }
        }
      }
    }
  }
}
