mutation ($reviewId: ID!, $path: String!, $line: Int!, $side: DiffSide!, $body: String!) {
  addPullRequestReviewThread(input: {
    pullRequestReviewId: $reviewId
    path: $path
    line: $line
    side: $side
    body: $body
  }) {
    thread {
      id
      isResolved
      isOutdated
      path
      line
      originalLine
      diffSide
      comments(first: 50) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          body
          createdAt
          author {
            login
          }
          pullRequestReview {
            state
          }
        }
      }
    }
  }
}
