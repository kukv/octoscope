# One repository's open issues: what the Repos tab lists beside the pull
# requests. Same ordering and the same 100-item ceiling as repo_prs.graphql.
query ($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    issues(
      states: OPEN
      first: 100
      orderBy: { field: CREATED_AT, direction: DESC }
    ) {
      nodes { ...IssueListFields }
    }
  }
}

fragment IssueListFields on Issue {
  number
  title
  state
  url
  updatedAt
  # The drawer under the list previews the body as plain text, the way the
  # board's does; bodyText is that same field with the markdown stripped, so a
  # heading or a template's comment markers do not fill the preview. The
  # markdown body and the conversation are not asked for here: opening the
  # issue fetches those.
  bodyText
  author {
    login
  }
  labels(first: 100) {
    nodes { ...LabelFields }
  }
}

fragment LabelFields on Label {
  name
  color
}
