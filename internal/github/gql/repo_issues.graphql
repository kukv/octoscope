# One repository's open issues: what the Repos tab lists beside the pull
# requests. Same ordering and the same 100-item ceiling as repo_prs.graphql.
query ($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    issues(
      states: OPEN
      first: 100
      orderBy: { field: CREATED_AT, direction: DESC }
    ) {
      nodes { ...IssueListFields }
    }
  }
}

fragment IssueListFields on Issue {
  number
  title
  state
  url
  updatedAt
  # The drawer under the list previews the body, so the list carries one. The
  # conversation is not asked for here: opening the item fetches that.
  body
  author {
    login
  }
  labels(first: 100) {
    nodes { ...LabelFields }
  }
}

fragment LabelFields on Label {
  name
  color
}
