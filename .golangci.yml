version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - depguard
  settings:
    depguard:
      rules:
        # ドメインは何にも依存しない。
        domain-layer:
          files:
            - "**/internal/app/domain/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/usecase
              desc: ドメインは上の層を知らない
            - pkg: github.com/kukv/octoscope/internal/app/presentation
              desc: ドメインは UI を知らない
            - pkg: github.com/kukv/octoscope/internal/app/config
              desc: ドメインは設定ファイルを知らない
            - pkg: github.com/kukv/octoscope/internal/github
              desc: ドメインは特定サービスのクライアントを知らない
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: ドメインは翻訳しない
            - pkg: github.com/kukv/octoscope/internal/browser
              desc: ドメインはブラウザを開かない
            - pkg: encoding/json
              desc: ドメインはワイヤ形式を知らない。デコードは internal/github が行う
        # GitHub クライアントはアプリの上位層を知らない。
        github-layer:
          files:
            - "**/internal/github/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/
              desc: クライアントはアプリケーションを知らない。変換は gateway が行う
        # usecase は画面も翻訳も知らない。
        usecase-layer:
          files:
            - "**/internal/app/usecase/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation
              desc: usecase は UI に依存しない
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: usecase は翻訳しない。訳すのは UI
        # ビューは usecase を通す。どのクライアントが動いているかを
        # 知っているのは cmd/octoscope だけである。
        presentation-layer:
          files:
            - "**/internal/app/presentation/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/github
              desc: ビューは usecase を通す。クライアントを名指しするのは cmd/octoscope だけ
            - pkg: github.com/kukv/octoscope/internal/app/config
              desc: 設定は Options で届く。読むのは cmd/octoscope
            - pkg: github.com/kukv/octoscope/internal/app/adapter
              desc: 保存は usecase を通す。store を組むのは cmd/octoscope だけ
        # 設定ファイルの読み取りは葉である。
        config-layer:
          files:
            - "**/internal/app/config/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/domain
              desc: config は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/app/usecase
              desc: config は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/app/presentation
              desc: config は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/github
              desc: config は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: config は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/browser
              desc: config は他のパッケージに依存しない
        # データの出し入れは adapter である。UI も GitHub クライアントも知らない。
        datasource-layer:
          files:
            - "**/internal/app/adapter/datasource/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/usecase
              desc: datasource は上の層を知らない
            - pkg: github.com/kukv/octoscope/internal/app/presentation
              desc: datasource は UI を知らない
            - pkg: github.com/kukv/octoscope/internal/github
              desc: datasource は GitHub クライアントを知らない
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: datasource は翻訳しない
        # gateway はサービスの型を domain に訳す。上の層は知らない。
        gateway-layer:
          files:
            - "**/internal/app/adapter/gateway/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/usecase
              desc: gateway は port を暗黙に満たす。usecase を import しない
            - pkg: github.com/kukv/octoscope/internal/app/presentation
              desc: gateway は UI を知らない
            - pkg: github.com/kukv/octoscope/internal/app/config
              desc: gateway は設定ファイルを知らない
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: gateway は翻訳しない
        # メッセージは葉である。
        i18n-layer:
          files:
            - "**/internal/i18n/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app
              desc: i18n は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/github
              desc: i18n は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/browser
              desc: i18n は他のパッケージに依存しない
        # URL を開くことは葉である。
        browser-layer:
          files:
            - "**/internal/browser/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app
              desc: browser は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/github
              desc: browser は他のパッケージに依存しない
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: browser は他のパッケージに依存しない
        # Views are siblings: a view must not reach into another view's model,
        # and no child may import its parent.
        tui-work:
          files:
            - "**/internal/app/presentation/tui/work/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/diff
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/review
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a child view must not import its parent
        tui-repo:
          files:
            - "**/internal/app/presentation/tui/repo/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/diff
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/review
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a child view must not import its parent
        tui-detail:
          files:
            - "**/internal/app/presentation/tui/detail/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/diff
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a child view must not import its parent
        tui-diff:
          files:
            - "**/internal/app/presentation/tui/diff/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a child view must not import its parent
        # review is a popup, not a view: work, repo and their siblings have no
        # reason to reach into it, and it must never import the views that
        # hold it (see internal/app/presentation/tui/review's own package comment).
        tui-review:
          files:
            - "**/internal/app/presentation/tui/review/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: review must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/diff
              desc: review must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a child must not import its parent
        # dialog is a popup, not a view: repo holds it today and search will
        # hold it too, so it must never import either.
        tui-dialog:
          files:
            - "**/internal/app/presentation/tui/dialog/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: a popup must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: a popup must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: a popup must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/diff
              desc: a popup must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a child must not import its parent
        # icon and layout sit below the views: they draw glyphs and measure
        # columns, and know nothing of the models that call them.
        tui-icon:
          files:
            - "**/internal/app/presentation/tui/icon/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/review
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a leaf must not depend on the views that use it
        tui-theme:
          files:
            - "**/internal/app/presentation/tui/theme/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/review
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a leaf must not depend on the views that use it
        tui-layout:
          files:
            - "**/internal/app/presentation/tui/layout/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/work
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/repo
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/detail
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/review
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui/root
              desc: a leaf must not depend on the views that use it
        # The golden recorder is a test helper: it takes a string and a name,
        # and must not know which view produced them.
        golden:
          files:
            - "**/internal/golden/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/app/presentation/tui
              desc: the golden recorder compares strings and knows nothing of ours
            - pkg: github.com/kukv/octoscope/internal/app/domain
              desc: the golden recorder compares strings and knows nothing of ours
            - pkg: github.com/kukv/octoscope/internal/github
              desc: the golden recorder compares strings and knows nothing of ours
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: the golden recorder compares strings and knows nothing of ours
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|unused-parameter):"
      - path: _test\.go
        linters:
          - gosec
      # gosec G204 flags exec.Command whenever its args are not literal
      # constants. internal/github/cli exists specifically to run "gh" with a
      # dynamic subcommand and flags built from typed values (see the
      # comment at the call site); there is exactly one call site, and no
      # amount of restructuring removes the "args are a variable" shape the
      # rule matches on. Excluding it here keeps the exception in one place
      # instead of a scattered //nolint.
      - path: internal/github/cli/cli\.go
        linters:
          - gosec
        text: "G204"
      # Same shape in internal/github/api: the one subprocess it runs is "git
      # remote get-url origin", with arguments that are this package's own
      # literals, never external input (see the comment at the call site).
      - path: internal/github/api/repo\.go
        linters:
          - gosec
        text: "G204"
      # Same shape in internal/browser: which program opens a URL is decided
      # at run time, from a fixed table per platform or from the browser the
      # user named in $BROWSER. The URL is a separate argument and no shell
      # is involved, so there is nothing for the rule to protect against.
      - path: internal/browser/browser\.go
        linters:
          - gosec
        text: "G204"
      # gosec G304 flags os.ReadFile whenever its path is not a literal
      # constant. Load's path parameter is what makes it testable (tests
      # pass a t.TempDir() path); the real caller always passes Path()'s own
      # fixed result (os.UserConfigDir()/octoscope/config.yaml), never
      # attacker- or network-supplied input.
      - path: internal/app/config/config\.go
        linters:
          - gosec
        text: "G304"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
