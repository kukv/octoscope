version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - depguard
  settings:
    depguard:
      rules:
        # The GitHub access layer must not know about the UI.
        gh-layer:
          files:
            - "**/internal/gh/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui
              desc: the GitHub layer must not depend on the UI
        # Messages are a leaf: they depend on nothing of ours.
        i18n-layer:
          files:
            - "**/internal/i18n/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/gh
              desc: internal/i18n must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/tui
              desc: internal/i18n must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/config
              desc: internal/i18n must not depend on other internal packages
        # Opening a URL is a leaf: it depends on nothing of ours.
        browser-layer:
          files:
            - "**/internal/browser/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/gh
              desc: internal/browser must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/tui
              desc: internal/browser must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: internal/browser must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/config
              desc: internal/browser must not depend on other internal packages
        # Views are siblings: a view must not reach into another view's model,
        # and no child may import its parent.
        tui-work:
          files:
            - "**/internal/tui/work/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/diff
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/review
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a child view must not import its parent
        tui-repo:
          files:
            - "**/internal/tui/repo/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/work
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/diff
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/review
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a child view must not import its parent
        tui-detail:
          files:
            - "**/internal/tui/detail/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/work
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/diff
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a child view must not import its parent
        tui-diff:
          files:
            - "**/internal/tui/diff/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/work
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a child view must not import its parent
        # review is a popup, not a view: work, repo and their siblings have no
        # reason to reach into it, and it must never import the views that
        # hold it (see internal/tui/review's own package comment).
        tui-review:
          files:
            - "**/internal/tui/review/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/work
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: review is a popup held by diff and detail, not a sibling view
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: review must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/tui/diff
              desc: review must not depend on the views that hold it
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a child must not import its parent
        # icon and layout sit below the views: they draw glyphs and measure
        # columns, and know nothing of the models that call them.
        tui-icon:
          files:
            - "**/internal/tui/icon/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/work
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/review
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a leaf must not depend on the views that use it
        tui-theme:
          files:
            - "**/internal/tui/theme/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/work
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/review
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a leaf must not depend on the views that use it
        tui-layout:
          files:
            - "**/internal/tui/layout/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/work
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/review
              desc: a leaf must not depend on the views that use it
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a leaf must not depend on the views that use it
        # The golden recorder is a test helper: it takes a string and a name,
        # and must not know which view produced them.
        golden:
          files:
            - "**/internal/golden/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui
              desc: the golden recorder compares strings and knows nothing of ours
            - pkg: github.com/kukv/octoscope/internal/gh
              desc: the golden recorder compares strings and knows nothing of ours
            - pkg: github.com/kukv/octoscope/internal/i18n
              desc: the golden recorder compares strings and knows nothing of ours
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|unused-parameter):"
      - path: _test\.go
        linters:
          - gosec
      # gosec G204 flags exec.Command whenever its args are not literal
      # constants. internal/gh/cli exists specifically to run "gh" with a
      # dynamic subcommand and flags built from typed values (see the
      # comment at the call site); there is exactly one call site, and no
      # amount of restructuring removes the "args are a variable" shape the
      # rule matches on. Excluding it here keeps the exception in one place
      # instead of a scattered //nolint.
      - path: internal/gh/cli/cli\.go
        linters:
          - gosec
        text: "G204"
      # Same shape in internal/browser: which program opens a URL is decided
      # at run time, from a fixed table per platform or from the browser the
      # user named in $BROWSER. The URL is a separate argument and no shell
      # is involved, so there is nothing for the rule to protect against.
      - path: internal/browser/browser\.go
        linters:
          - gosec
        text: "G204"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
