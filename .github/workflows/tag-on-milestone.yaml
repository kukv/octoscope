name: Tag on milestone

on:
  milestone:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # protect-tags lets octoscope-releaser create tags, and a tag pushed
      # with an App token starts release.yaml through its push trigger.
      - name: Create a token for octoscope-releaser
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kukv
          repositories: octoscope
          permission-contents: write
      - name: Tag main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.milestone.title }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Milestone '$TAG' is not a version; no tag pushed."
            exit 0
          fi
          # Reopening and closing a milestone again must not release twice.
          if gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::notice::Tag $TAG already exists; nothing to do."
            exit 0
          fi
          sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" --silent
