name: Tag on milestone

on:
  milestone:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
      # tag push alone would never reach release.yaml. workflow_dispatch is
      # the exception to that rule, so the release is started explicitly.
      - name: Tag main and start the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.milestone.title }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::notice::Milestone '$TAG' is not a version; no tag pushed."
            exit 0
          fi
          # Reopening and closing a milestone again must not release twice.
          if gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::notice::Tag $TAG already exists; nothing to do."
            exit 0
          fi
          sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" --silent
          gh workflow run release.yaml --repo "$REPO" --ref "$TAG"
